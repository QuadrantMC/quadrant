# @format

name: "Build for Microsoft Store"

on:
  push:
    tags:
      - "v*-stable"
      - "v*-msstore"

jobs:
  build-msstore:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-2025-vs2026"
            args: ""
          # - platform: "windows-11-arm"
          #   args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Setup MSbuild
        uses: microsoft/setup-msbuild@v2
      - name: Install msixbundle-cli
        run: cargo install msixbundle-cli
      - name: Set up Clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: latest
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: latest

      - name: Build the app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ETERNAL_API_TOKEN: ${{ secrets.ETERNAL_API_TOKEN }}
          QUADRANT_API_KEY: ${{ secrets.QUADRANT_API_KEY }}
          QUADRANT_OAUTH2_CLIENT_ID: ${{ secrets.QUADRANT_OAUTH2_CLIENT_ID }}
          QUADRANT_OAUTH2_CLIENT_SECRET: ${{ secrets.QUADRANT_OAUTH2_CLIENT_SECRET }}
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target add aarch64-pc-windows-msvc
          bun tauri build --config src-tauri/tauri.msstore.conf.json --target x86_64-pc-windows-msvc
          bun tauri build --config src-tauri/tauri.msstore.conf.json --target aarch64-pc-windows-msvc
          powershell -NoProfile -ExecutionPolicy Bypass -File .\msixbuild.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: quadrant_msstore
          path: "AppxBundles/*"

      - name: Upload MS Store bundles to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $releaseFound = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            gh release view $env:TAG_NAME | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $releaseFound = $true
              break
            }

            Start-Sleep -Seconds 10
          }

          if (-not $releaseFound) {
            throw "GitHub release for tag '$env:TAG_NAME' was not found after waiting."
          }

          $bundleFiles = Get-ChildItem -Path AppxBundles -File -Recurse
          if ($bundleFiles.Count -eq 0) {
            throw "No files were found in AppxBundles to upload."
          }

          $bundlePaths = $bundleFiles | ForEach-Object { $_.FullName }
          gh release upload $env:TAG_NAME --clobber @bundlePaths

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Submit package to Microsoft Store
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_APP_ID }}
          # MSSTORE_FLIGHT_ID: ${{ vars.MSSTORE_FLIGHT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_PRODUCT_ID)) {
            throw "Repository variable 'MSSTORE_PRODUCT_ID' must be set to the Microsoft Store product ID."
          }

          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET

          if ($LASTEXITCODE -ne 0) {
            throw "msstore reconfigure failed with exit code $LASTEXITCODE"
          }

          $packagePreference = @{
            ".msixupload" = 0
            ".appxupload" = 1
            ".msixbundle" = 2
            ".appxbundle" = 3
            ".msix" = 4
            ".appx" = 5
          }

          $packageCandidates = Get-ChildItem -Path AppxBundles -File -Recurse | Where-Object {
            $packagePreference.ContainsKey($_.Extension.ToLowerInvariant())
          } | Sort-Object @{
            Expression = {
              $packagePreference[$_.Extension.ToLowerInvariant()]
            }
          }, FullName

          if ($packageCandidates.Count -eq 0) {
            throw "No publishable MS Store package was found in AppxBundles."
          }

          $packagePath = $packageCandidates[0].FullName
          Write-Host "Submitting package to Microsoft Store: $packagePath"

          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_FLIGHT_ID)) {
            msstore publish $packagePath -id $env:MSSTORE_PRODUCT_ID

            if ($LASTEXITCODE -ne 0) {
              throw "msstore publish failed with exit code $LASTEXITCODE"
            }

            msstore submission poll $env:MSSTORE_PRODUCT_ID

            if ($LASTEXITCODE -ne 0) {
              throw "msstore submission poll failed with exit code $LASTEXITCODE"
            }
          }
          else {
            msstore publish $packagePath -id $env:MSSTORE_PRODUCT_ID --flightId $env:MSSTORE_FLIGHT_ID

            if ($LASTEXITCODE -ne 0) {
              throw "msstore publish failed with exit code $LASTEXITCODE"
            }

            msstore flights submission poll $env:MSSTORE_PRODUCT_ID $env:MSSTORE_FLIGHT_ID

            if ($LASTEXITCODE -ne 0) {
              throw "msstore flights submission poll failed with exit code $LASTEXITCODE"
            }
          }
