# @format

name: "Build for Microsoft Store"

on:
  push:
    tags:
      - "v*-stable"
      - "v*-msstore"

jobs:
  # Build each architecture in parallel. msixbuild.ps1 consumes each arch's
  # executable independently, so the two builds have no interdependency and the
  # slow Rust compile happens concurrently instead of back-to-back.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            triple: x86_64-pc-windows-msvc
            msvcArch: amd64
          - arch: arm64
            triple: aarch64-pc-windows-msvc
            msvcArch: amd64_arm64
    runs-on: "windows-latest"
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.arch }}
      - name: Set up Clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: latest
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvcArch }}

      - name: Build the app
        env:
          # Thin LTO + parallel codegen build far faster than the shipping
          # profile's fat LTO / codegen-units=1, at a negligible runtime cost
          # for this I/O-bound app. Scoped to CI here; Cargo.toml is unchanged,
          # so the GitHub -stable release keeps the fully optimized profile.
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ETERNAL_API_TOKEN: ${{ secrets.ETERNAL_API_TOKEN }}
          QUADRANT_API_KEY: ${{ secrets.QUADRANT_API_KEY }}
          QUADRANT_OAUTH2_CLIENT_ID: ${{ secrets.QUADRANT_OAUTH2_CLIENT_ID }}
          QUADRANT_OAUTH2_CLIENT_SECRET: ${{ secrets.QUADRANT_OAUTH2_CLIENT_SECRET }}
        run: |
          rustup target add ${{ matrix.triple }}
          bun tauri build --config src-tauri/tauri.msstore.conf.json --target ${{ matrix.triple }}

      - name: Upload built executable
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.triple }}/release/quadrant_next.exe
          if-no-files-found: error

  # Fan-in: assemble the MSIX bundle from both arch executables and submit it.
  bundle-and-publish:
    needs: build
    permissions:
      contents: write
    runs-on: "windows-2025-vs2026"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSbuild
        uses: microsoft/setup-msbuild@v2

      - name: Install msixbundle-cli
        run: cargo install msixbundle-cli

      - name: Download built executables
        uses: actions/download-artifact@v4
        with:
          pattern: exe-*
          path: artifacts

      - name: Stage executables for bundling
        shell: pwsh
        run: |
          $map = @{
            "exe-x64"   = "src-tauri/target/x86_64-pc-windows-msvc/release"
            "exe-arm64" = "src-tauri/target/aarch64-pc-windows-msvc/release"
          }
          foreach ($name in $map.Keys) {
            $src = Join-Path "artifacts/$name" "quadrant_next.exe"
            if (-not (Test-Path -Path $src -PathType Leaf)) {
              throw "Missing artifact executable: $src"
            }
            $destDir = $map[$name]
            New-Item -ItemType Directory -Path $destDir -Force | Out-Null
            Copy-Item -Path $src -Destination (Join-Path $destDir "quadrant_next.exe") -Force
          }

      - name: Build MSIX bundle
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\msixbuild.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: quadrant_msstore
          path: "AppxBundles/*"

      - name: Upload MS Store bundles to release
        # Releases are only created for -stable tags (see release.yml). A
        # -msstore tag has no matching release, so skip the upload and go
        # straight to the Store submission instead of failing the job.
        if: endsWith(github.ref_name, '-stable')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $releaseFound = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            gh release view $env:TAG_NAME | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $releaseFound = $true
              break
            }

            Start-Sleep -Seconds 10
          }

          if (-not $releaseFound) {
            throw "GitHub release for tag '$env:TAG_NAME' was not found after waiting."
          }

          $bundleFiles = Get-ChildItem -Path AppxBundles -File -Recurse
          if ($bundleFiles.Count -eq 0) {
            throw "No files were found in AppxBundles to upload."
          }

          $bundlePaths = $bundleFiles | ForEach-Object { $_.FullName }
          gh release upload $env:TAG_NAME --clobber @bundlePaths

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Submit package to Microsoft Store
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_APP_ID }}
          # MSSTORE_FLIGHT_ID: ${{ vars.MSSTORE_FLIGHT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_PRODUCT_ID)) {
            throw "Repository variable 'MSSTORE_PRODUCT_ID' must be set to the Microsoft Store product ID."
          }

          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET

          if ($LASTEXITCODE -ne 0) {
            throw "msstore reconfigure failed with exit code $LASTEXITCODE"
          }

          # Diagnostics: show which products this identity can actually see and
          # whether the configured product ID resolves. A missing product here
          # means an authorization / first-submission / wrong-ID problem in
          # Partner Center rather than a packaging issue. Non-fatal on purpose.
          Write-Host "=== Apps visible to this identity ==="
          msstore apps list
          Write-Host "=== Trying to GET product '$env:MSSTORE_PRODUCT_ID' ==="
          msstore apps get $env:MSSTORE_PRODUCT_ID

          $packagePreference = @{
            ".msixupload" = 0
            ".appxupload" = 1
            ".msixbundle" = 2
            ".appxbundle" = 3
            ".msix" = 4
            ".appx" = 5
          }

          $packageCandidates = Get-ChildItem -Path AppxBundles -File -Recurse | Where-Object {
            $packagePreference.ContainsKey($_.Extension.ToLowerInvariant())
          } | Sort-Object @{
            Expression = {
              $packagePreference[$_.Extension.ToLowerInvariant()]
            }
          }, FullName

          if ($packageCandidates.Count -eq 0) {
            throw "No publishable MS Store package was found in AppxBundles."
          }

          $packagePath = $packageCandidates[0].FullName
          Write-Host "Submitting package to Microsoft Store: $packagePath"

          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_FLIGHT_ID)) {
            msstore publish $packagePath -id $env:MSSTORE_PRODUCT_ID

            if ($LASTEXITCODE -ne 0) {
              throw "msstore publish failed with exit code $LASTEXITCODE"
            }

            msstore submission poll $env:MSSTORE_PRODUCT_ID

            if ($LASTEXITCODE -ne 0) {
              throw "msstore submission poll failed with exit code $LASTEXITCODE"
            }
          }
          else {
            msstore publish $packagePath -id $env:MSSTORE_PRODUCT_ID --flightId $env:MSSTORE_FLIGHT_ID

            if ($LASTEXITCODE -ne 0) {
              throw "msstore publish failed with exit code $LASTEXITCODE"
            }

            msstore flights submission poll $env:MSSTORE_PRODUCT_ID $env:MSSTORE_FLIGHT_ID

            if ($LASTEXITCODE -ne 0) {
              throw "msstore flights submission poll failed with exit code $LASTEXITCODE"
            }
          }
