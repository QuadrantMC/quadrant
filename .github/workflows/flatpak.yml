# @format

name: Flathub Sync

on:
  workflow_call:
    inputs:
      tag:
        description: Stable tag to sync to Flathub, e.g. v26.3.1-stable
        required: true
        type: string
      release_repo:
        description: Repository that owns the release assets
        required: false
        type: string
        default: quadrantmc/quadrant
    secrets:
      FLATHUB_GH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag to sync to Flathub, e.g. v26.3.1-stable
        required: true
        type: string
      release_repo:
        description: Repository that owns the release assets
        required: false
        type: string
        default: quadrantmc/quadrant

jobs:
  open_flathub_pr:
    name: Open Flathub PR
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      RELEASE_REPO: ${{ inputs.release_repo }}
      FLATHUB_BASE_REPO: flathub/dev.mrquantumoff.mcmodpackmanager
      FLATHUB_REPO_NAME: dev.mrquantumoff.mcmodpackmanager
      FLATHUB_BRANCH: ci/flathub-${{ inputs.tag }}
      MANIFEST_PATH: dev.mrquantumoff.mcmodpackmanager.yml
      METAINFO_PATH: dev.mrquantumoff.mcmodpackmanager.metainfo.xml
      GH_TOKEN: ${{ secrets.FLATHUB_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Derive release version
        id: release_version
        run: |
          set -euo pipefail

          # TAG and RELEASE_REPO come from a caller or a manual run and end up
          # in a branch name, a release download and a pull request head.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Expected TAG like v26.3.1-stable, got: $TAG" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Expected RELEASE_REPO like owner/name, got: $RELEASE_REPO" >&2
            exit 1
          fi

          version="${TAG#v}"

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download stable release assets
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p downloads

          gh release download "$TAG" \
            --repo "$RELEASE_REPO" \
            --dir downloads \
            --pattern "Quadrant_${VERSION}_amd64.deb" \
            --pattern "Quadrant_${VERSION}_arm64.deb"

      - name: Compute source hashes
        id: hashes
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail

          metainfo_sha="$(sha256sum "$METAINFO_PATH" | awk '{print $1}')"
          amd64_sha="$(sha256sum "downloads/Quadrant_${VERSION}_amd64.deb" | awk '{print $1}')"
          arm64_sha="$(sha256sum "downloads/Quadrant_${VERSION}_arm64.deb" | awk '{print $1}')"

          echo "metainfo_sha=$metainfo_sha" >> "$GITHUB_OUTPUT"
          echo "amd64_sha=$amd64_sha" >> "$GITHUB_OUTPUT"
          echo "arm64_sha=$arm64_sha" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub authentication for git
        run: |
          set -euo pipefail
          gh auth setup-git

      - name: Resolve writable Flathub fork
        id: flathub_head_repo
        run: |
          set -euo pipefail

          owner="$(gh api user --jq .login)"
          repo="${owner}/${FLATHUB_REPO_NAME}"

          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Ensure writable Flathub fork exists
        env:
          FLATHUB_HEAD_REPO: ${{ steps.flathub_head_repo.outputs.repo }}
        run: |
          set -euo pipefail

          if gh repo view "$FLATHUB_HEAD_REPO" >/dev/null 2>&1; then
            exit 0
          fi

          gh repo fork "$FLATHUB_BASE_REPO" --remote=false --clone=false

      - name: Clone Flathub manifest repo
        env:
          FLATHUB_HEAD_REPO: ${{ steps.flathub_head_repo.outputs.repo }}
        run: |
          set -euo pipefail
          gh repo clone "$FLATHUB_HEAD_REPO" flathub-manifest

      - name: Update Flathub manifest branch
        id: update_manifest
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
          FLATHUB_HEAD_REPO: ${{ steps.flathub_head_repo.outputs.repo }}
        run: |
          set -euo pipefail

          cd flathub-manifest

          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream "https://github.com/${FLATHUB_BASE_REPO}.git"
          fi

          branch_exists=false
          if git ls-remote --exit-code --heads origin "$FLATHUB_BRANCH" >/dev/null 2>&1; then
            branch_exists=true
          fi

          git fetch upstream master
          if [ "$branch_exists" = true ]; then
            git fetch origin "refs/heads/$FLATHUB_BRANCH:refs/remotes/origin/$FLATHUB_BRANCH"
            git checkout -B "$FLATHUB_BRANCH" "origin/$FLATHUB_BRANCH"
          else
            git checkout -B "$FLATHUB_BRANCH" upstream/master
          fi

          python3 "$GITHUB_WORKSPACE/scripts/update_flathub_manifest.py" \
            --tag "$TAG" \
            --version "$VERSION" \
            --release-repo "$RELEASE_REPO" \
            --metainfo-sha "${{ steps.hashes.outputs.metainfo_sha }}" \
            --amd64-sha "${{ steps.hashes.outputs.amd64_sha }}" \
            --arm64-sha "${{ steps.hashes.outputs.arm64_sha }}" \
            --manifest-path "$MANIFEST_PATH"

          if git diff --quiet -- "$MANIFEST_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "branch_exists=$branch_exists" >> "$GITHUB_OUTPUT"

      - name: Commit and push Flathub branch
        if: steps.update_manifest.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail

          cd flathub-manifest

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST_PATH"
          git commit -m "Update Quadrant to $VERSION"
          git push --force-with-lease origin "$FLATHUB_BRANCH"

      - name: Open or update Flathub PR
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
          FLATHUB_HEAD_OWNER: ${{ steps.flathub_head_repo.outputs.owner }}
        run: |
          set -euo pipefail

          metainfo_url="https://github.com/${RELEASE_REPO}/raw/${TAG}/${METAINFO_PATH}"
          amd64_url="https://github.com/${RELEASE_REPO}/releases/download/${TAG}/Quadrant_${VERSION}_amd64.deb"
          arm64_url="https://github.com/${RELEASE_REPO}/releases/download/${TAG}/Quadrant_${VERSION}_arm64.deb"
          pr_head="${FLATHUB_HEAD_OWNER}:${FLATHUB_BRANCH}"

          {
            printf '%s\n' "This PR was generated from the Quadrant release workflow after publishing the stable release assets."
            printf '\n'
            printf '%s\n' "- Tag: \`${TAG}\`"
            printf '%s\n' "- Metainfo URL: \`${metainfo_url}\`"
            printf '%s\n' "- Metainfo SHA256: \`${{ steps.hashes.outputs.metainfo_sha }}\`"
            printf '%s\n' "- amd64 URL: \`${amd64_url}\`"
            printf '%s\n' "- amd64 SHA256: \`${{ steps.hashes.outputs.amd64_sha }}\`"
            printf '%s\n' "- arm64 URL: \`${arm64_url}\`"
            printf '%s\n' "- arm64 SHA256: \`${{ steps.hashes.outputs.arm64_sha }}\`"
          } > pr-body.md

          pr_number="$(gh pr list \
            --repo "$FLATHUB_BASE_REPO" \
            --head "$pr_head" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --repo "$FLATHUB_BASE_REPO" \
              --title "Update Quadrant to ${VERSION}" \
              --body-file pr-body.md
            exit 0
          fi

          if [ "${{ steps.update_manifest.outputs.changed }}" != "true" ] && [ "${{ steps.update_manifest.outputs.branch_exists }}" != "true" ]; then
            echo "Manifest already matches master and no existing branch/PR was found for $TAG." >&2
            exit 1
          fi

          gh pr create \
            --repo "$FLATHUB_BASE_REPO" \
            --base master \
            --head "$pr_head" \
            --title "Update Quadrant to ${VERSION}" \
            --body-file pr-body.md
