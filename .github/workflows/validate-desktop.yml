name: Validate Desktop

on:
  pull_request:
  push:
    branches:
      # Must track the repository's default branch. GitHub only shares a cache
      # entry with other refs when it was written from the default branch, so
      # these pushes are the only thing that keeps PR builds off a cold cache.
      - next

permissions:
  contents: read

# A newer push to the same PR makes the in-flight validation obsolete, so let it
# go instead of paying for two full matrices. Pushes to `next` are never
# cancelled: they are what populate the shared caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fat LTO with a single codegen unit is the right profile for a shipping
  # binary, not for a does-it-compile check. Thin LTO with parallel codegen
  # produces the same diagnostics far faster. Cargo.toml keeps the fully
  # optimized profile, so local release builds are unaffected.
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_INCREMENTAL: "0"

jobs:
  # Frontend-only changes do not need three Rust compiles. This gate runs on a
  # GitHub-hosted runner so the check itself costs nothing, and downstream jobs
  # report as "skipped" (which satisfies required status checks) rather than
  # never reporting at all, the way a workflow-level `paths:` filter would.
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      # On `pull_request` the filter resolves the diff through the API, but on
      # `push` it shells out to git, so the repository has to be present.
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            native:
              - 'src-tauri/**'
              - 'package.json'
              - 'scripts/build-cli.ts'
              - 'bun.lock'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - 'index.html'
              - 'postcss.config.cjs'
              - 'dev.mrquantumoff.mcmodpackmanager.metainfo.xml'
              - 'Quadrant.desktop'
              - '.github/workflows/validate-desktop.yml'

  test-rust:
    needs: changes
    # Pushes always build so the default-branch cache stays fresh, even when the
    # commit only touched the renderer.
    if: needs.changes.outputs.native == 'true' || github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # quadrant-core itself now compiles credential-free; the top-level Tauri
      # crate and the curseforge feature still read these at compile time, so
      # workspace-wide builds need placeholder values.
      QUADRANT_API_KEY: dev
      QUADRANT_OAUTH2_CLIENT_ID: dev
      QUADRANT_OAUTH2_CLIENT_SECRET: dev
      ETERNAL_API_TOKEN: dev
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux desktop dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev xdg-utils libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # Only the default branch writes a cache other refs can read, so PR
          # runs restore without spending time uploading an entry that nothing
          # else will ever restore.
          save-if: ${{ github.ref == 'refs/heads/next' }}

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --workspace

      # Advisory only, and clippy shares no artifacts with `cargo test`, so on a
      # PR this is a second full workspace compile whose output is discarded.
      # Keep the signal on `next` and stop charging every PR for it. Switch to
      # `-- -D warnings` here once the warning backlog is cleared.
      - name: Clippy (advisory)
        if: github.event_name == 'push'
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets || true

  test-frontend:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      # Vitest runs its workers under Node, and jsdom needs a current one.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Frozen so an unreadable or stale lockfile fails here instead of
      # silently installing whatever is newest.
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Type-checks and bundles the renderer. This job always runs, so the
      # native jobs below can be skipped on renderer-only changes without
      # losing `tsc` coverage.
      - name: Build shared renderer
        run: bun run build

      - name: Run frontend tests
        run: bun run test

  validate:
    needs: changes
    if: needs.changes.outputs.native == 'true' || github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # The Tauri crate and the curseforge feature use compile-time env!()
      # for these desktop-only credentials, so CI must provide placeholder
      # values for every Rust build.
      QUADRANT_API_KEY: dev
      QUADRANT_OAUTH2_CLIENT_ID: dev
      QUADRANT_OAUTH2_CLIENT_SECRET: dev
      ETERNAL_API_TOKEN: dev
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev xdg-utils libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev appstream desktop-file-utils

      - name: Validate Linux metadata
        run: |
          appstreamcli validate --no-net dev.mrquantumoff.mcmodpackmanager.metainfo.xml
          desktop_file="$(mktemp --suffix=.desktop)"
          trap 'rm -f "$desktop_file"' EXIT
          sed \
            -e 's/{{categories}}/Game;/' \
            -e 's/{{comment}}/Manage Minecraft mods and modpacks/' \
            -e 's/{{exec}}/quadrant_next/' \
            -e 's/{{icon}}/dev.mrquantumoff.mcmodpackmanager/' \
            -e 's/{{name}}/Quadrant/' \
            Quadrant.desktop > "$desktop_file"
          desktop-file-validate "$desktop_file"

      - name: Install frontend dependencies
        run: bun install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/next' }}

      # No separate renderer build: `tauri build` runs `beforeBuildCommand`
      # itself, so building it here first ran tsc + vite twice. The merged
      # config's `beforeBuildCommand` also builds the quadrantmc sidecar, which
      # the release packages bundle.
      - name: Build Tauri shell
        run: bun tauri build --no-bundle --config src-tauri/tauri.cli.conf.json

  validate-macos:
    needs: changes
    if: needs.changes.outputs.native == 'true' || github.event_name == 'push'
    runs-on: macos-latest
    env:
      QUADRANT_API_KEY: dev
      QUADRANT_OAUTH2_CLIENT_ID: dev
      QUADRANT_OAUTH2_CLIENT_SECRET: dev
      ETERNAL_API_TOKEN: dev
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: bun install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/next' }}

      # `generate_context!` resolves `frontendDist` at compile time, so the
      # bundle has to exist even for a check-only build.
      - name: Build shared renderer
        run: bun run build

      # This job exists to catch macOS-only cfg code (the Apple keyring store)
      # failing to compile. `cargo check` reports the same errors without
      # codegen, LTO or linking, which is where a full `tauri build` spent
      # almost all of its time.
      - name: Check Apple-Silicon Tauri shell
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-darwin
