name: Validate Desktop

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release

permissions:
  contents: read

jobs:
  test-rust:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # quadrant-core itself now compiles credential-free; the top-level Tauri
      # crate and the curseforge feature still read these at compile time, so
      # workspace-wide builds need placeholder values.
      QUADRANT_API_KEY: dev
      QUADRANT_OAUTH2_CLIENT_ID: dev
      QUADRANT_OAUTH2_CLIENT_SECRET: dev
      ETERNAL_API_TOKEN: dev
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux desktop dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev xdg-utils libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --workspace

      # Non-blocking until the existing warning backlog is cleared; then
      # switch to `-- -D warnings`.
      - name: Clippy (advisory)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets || true

  test-frontend:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install frontend dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Run frontend tests
        run: bun run test

  validate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # The Tauri crate and the curseforge feature use compile-time env!()
      # for these desktop-only credentials, so CI must provide placeholder
      # values for every Rust build.
      QUADRANT_API_KEY: dev
      QUADRANT_OAUTH2_CLIENT_ID: dev
      QUADRANT_OAUTH2_CLIENT_SECRET: dev
      ETERNAL_API_TOKEN: dev
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev xdg-utils libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev appstream desktop-file-utils

      - name: Validate Linux metadata
        run: |
          appstreamcli validate --no-net dev.mrquantumoff.mcmodpackmanager.metainfo.xml
          desktop_file="$(mktemp --suffix=.desktop)"
          trap 'rm -f "$desktop_file"' EXIT
          sed \
            -e 's/{{categories}}/Game;/' \
            -e 's/{{comment}}/Manage Minecraft mods and modpacks/' \
            -e 's/{{exec}}/quadrant_next/' \
            -e 's/{{icon}}/dev.mrquantumoff.mcmodpackmanager/' \
            -e 's/{{name}}/Quadrant/' \
            Quadrant.desktop > "$desktop_file"
          desktop-file-validate "$desktop_file"

      - name: Install frontend dependencies
        run: bun install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build shared renderer
        run: bun run build

      - name: Build Tauri shell
        run: bun tauri build --no-bundle

  validate-macos:
    runs-on: macos-latest
    env:
      QUADRANT_API_KEY: dev
      QUADRANT_OAUTH2_CLIENT_ID: dev
      QUADRANT_OAUTH2_CLIENT_SECRET: dev
      ETERNAL_API_TOKEN: dev
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: bun install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build shared renderer
        run: bun run build

      - name: Build Apple-Silicon Tauri shell
        run: bun tauri build --no-bundle --target aarch64-apple-darwin
