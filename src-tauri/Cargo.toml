[package]
name = "quadrant_next"
version.workspace = true
description = "An easy way to manage your Minecraft mods and modpacks"
authors = ["Demir Yerli <me@mrquantumoff.dev>"]
edition = "2024"

[workspace]
members = [
    "crates/quadrant-core",
    "crates/quadrant-host",
    "crates/quadrant-napi",
]

[workspace.package]
version = "26.7.8-stable"

[workspace.dependencies]
anyhow = "1.0.103"
apple-native-keyring-store = { version = "1.0.1", features = ["keychain"] }
chrono = { version = "0.4.45", features = ["serde"] }
colog = "1.4.0"
dbus-secret-service-keyring-store = { version = "1.0.0", features = [
    "crypto-rust",
    "vendored",
] }
dirs = "6.0.0"
futures = "0.3.32"
hex = "0.4.3"
http-cache-reqwest = { version = "1.0.0-alpha.6", default-features = false, features = [
    "manager-moka",
    "url-standard",
] }
httpmock = "0.8.3"
keyring-core = { version = "1.0.0" }
log = "0.4.33"
moka = { version = "0.12.15", features = ["future"] }
napi = { version = "3.10.5", default-features = false, features = [
    "napi8",
    "tokio_rt",
    "serde-json",
] }
napi-build = "2.3.2"
napi-derive = "3.5.10"
once_cell = "1.21.4"
open = "5.4.0"
reqwest = { version = "0.13.4", features = [
    "json",
    "rustls",
    "cookies",
    "query",
    "form",
    "stream",
] }
reqwest-middleware = "0.5.2"
rss = "2.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.11.0"
tauri = { version = "2.11.5", features = ["tray-icon", "config-json5"] }
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-cli = "2.4.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
tauri-plugin-http = "2.5.9"
tauri-plugin-notification = "2.3.3"
tauri-plugin-oauth = "2.1.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-persisted-scope = "2.3.7"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-updater = "2.10.1"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = [
    "rustls-tls-webpki-roots",
    "connect",
] }
url = { version = "2.5.8", features = ["serde", "std"] }
urlencoding = "2.1.3"
uuid = { version = "1.23.5", features = ["v7"] }
windows-native-keyring-store = "1.1.0"
zip = "8.6.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quadrant_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["proprietary"]
telemetry = []
curseforge = ["quadrant-core/curseforge", "quadrant-host/curseforge"]
# Quadrant ID/Sync/Share
quadrant_id = []
updater = []
proprietary = ["telemetry", "curseforge", "quadrant_id"]


[build-dependencies]
tauri-build = { workspace = true }


[dependencies]

tauri = { workspace = true }
quadrant-core = { path = "crates/quadrant-core" }
quadrant-host = { path = "crates/quadrant-host" }

tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
log = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-os = { workspace = true }
rss = { workspace = true }
uuid = { workspace = true }
tauri-plugin-http = { workspace = true }
tokio = { workspace = true }
urlencoding = { workspace = true }
open = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }
sha1 = { workspace = true }
hex = { workspace = true }
colog = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-dialog = { workspace = true }
keyring-core = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-persisted-scope = { workspace = true }
http-cache-reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
reqwest = { workspace = true }
once_cell = { workspace = true }
tauri-plugin-oauth = { workspace = true }
zip = { workspace = true }
url = { workspace = true }


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-cli = { workspace = true }
tauri-plugin-updater = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { workspace = true }

[profile.dev]
opt-level = 0
overflow-checks = false


[profile.release]
opt-level = 3
overflow-checks = true
codegen-units = 1
lto = "fat"
