[package]
name = "quadrant_next"
version.workspace = true
description = "An easy way to manage your Minecraft mods and modpacks"
authors = ["Demir Yerli <me@mrquantumoff.dev>"]
edition = "2024"

[workspace]
members = [
    "crates/quadrant-core",
    "crates/quadrant-host",
    "crates/quadrant-napi",
]

[workspace.package]
version = "26.8.0-stable"

[workspace.dependencies]
anyhow = "1.0.104"
apple-native-keyring-store = { version = "1.0.1", features = ["keychain"] }
chrono = { version = "0.4.45", features = ["serde"] }
colog = "1.4.0"
dbus-secret-service-keyring-store = { version = "1.0.0", features = [
    "crypto-rust",
    "vendored",
] }
dirs = "6.0.0"
futures = "0.3.33"
hex = "0.4.3"
http-cache-reqwest = { version = "1.0.0-alpha.6", default-features = false, features = [
    "manager-moka",
    "url-standard",
] }
httpmock = "0.8.3"
keyring-core = { version = "1.0.0" }
log = "0.4.33"
moka = { version = "0.12.15", features = ["future"] }
napi = { version = "3.11.0", default-features = false, features = [
    "napi8",
    "tokio_rt",
    "serde-json",
] }
napi-build = "2.3.2"
napi-derive = "3.6.0"
once_cell = "1.21.4"
open = "5.4.0"
reqwest = { version = "0.13.4", features = [
    "json",
    "rustls",
    "cookies",
    "query",
    "form",
    "stream",
] }
reqwest-middleware = "0.5.2"
rss = "2.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
# `wry` is deliberately *not* in this list: the runtime is picked by the
# `wry`/`cef` features of the app crate below, so that `--features cef` can
# build against the CEF runtime without also dragging in WebView2/WebKitGTK.
# The rest of this list is Tauri's `default` minus `wry`.
#
# The requirement is `2.11`, not `2.11.5`: the CEF patch below resolves to
# 2.11.3, and a `2.11.5` floor would exclude it. Unpatched, cargo still picks
# the newest 2.11.x.
tauri = { version = "2.11", default-features = false, features = [
    "tray-icon",
    "config-json5",
    "compression",
    "common-controls-v6",
    "dynamic-acl",
    "x11",
    "dbus",
] }
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-cli = "2.4.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
tauri-plugin-http = "2.5.9"
tauri-plugin-notification = "2.3.3"
tauri-plugin-oauth = "2.1.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-persisted-scope = "2.3.7"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-updater = "2.10.1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = [
    "rustls-tls-webpki-roots",
    "connect",
] }
url = { version = "2.5.8", features = ["serde", "std"] }
urlencoding = "2.1.3"
uuid = { version = "1.23.5", features = ["v7"] }
windows-native-keyring-store = "1.1.0"
zip = "8.6.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quadrant_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["proprietary", "wry"]
# Webview runtime. Exactly one of these should be enabled.
# `wry` is the shipping runtime (WebView2 / WKWebView / WebKitGTK).
# `cef` is the experimental Chromium Embedded Framework runtime from Tauri's
# `feat/cef` branch — see CEF.md. Build it with:
#   --no-default-features --features proprietary,cef
wry = ["tauri/wry"]
cef = ["tauri/cef", "dep:cef-dll-sys"]
telemetry = []
curseforge = ["quadrant-core/curseforge", "quadrant-host/curseforge"]
# Quadrant ID/Sync/Share
quadrant_id = []
updater = []
proprietary = ["telemetry", "curseforge", "quadrant_id"]


[build-dependencies]
tauri-build = { workspace = true }


[dependencies]

tauri = { workspace = true }
quadrant-core = { path = "crates/quadrant-core" }
quadrant-host = { path = "crates/quadrant-host" }

tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
log = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-os = { workspace = true }
rss = { workspace = true }
uuid = { workspace = true }
tauri-plugin-http = { workspace = true }
tokio = { workspace = true }
urlencoding = { workspace = true }
open = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }
sha1 = { workspace = true }
hex = { workspace = true }
colog = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-dialog = { workspace = true }
keyring-core = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-persisted-scope = { workspace = true }
http-cache-reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
reqwest = { workspace = true }
once_cell = { workspace = true }
tauri-plugin-oauth = { workspace = true }
zip = { workspace = true }
url = { workspace = true }

# Never referenced from our code — this exists purely to pin a version.
# `tauri-runtime-cef` at alpha.13 pins `cef = "=148.0.0"` but leaves its
# `cef-dll-sys` companion on a caret requirement, so cargo happily resolves
# 148.4.0 against 148.0.0's generated bindings and `cef` fails to compile with
# "no variant ... CEF_CONTENT_SETTING_TYPE_SUB_APP_INSTALLATION_PROMPTS".
# Upstream fixed this after alpha.13 by locking both crates; this entry does the
# same from our side. Drop it when the patch above moves past that fix.
cef-dll-sys = { version = "=148.0.0", default-features = false, optional = true }


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-cli = { workspace = true }
tauri-plugin-updater = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { workspace = true }

# The CEF runtime (`tauri-runtime-cef`) is not published to crates.io — it only
# exists on Tauri's `feat/cef` line, which is what the unreleased
# `@tauri-apps/cli-cef@3` alpha targets. Patching rather than depending on the
# git repo directly is required because every `tauri-plugin-*` we use resolves
# `tauri` from crates.io; without the patch cargo would link two incompatible
# copies of the same crate.
#
# The redirect applies to the `wry` build too. That is intentional: the CEF line
# is a superset of the 2.11.5 release these crates already pin, so both runtimes
# build from one source of truth. Delete this whole block to go back to plain
# crates.io Tauri — the `cef` feature stops compiling, `wry` keeps working.
#
# Two pins, and they have to move together:
#
#   * `tauri-cef-v3.0.0-alpha.13` in tauri-apps/tauri.
#   * plugins-workspace `feat/cef` @ 1423992, which is pinned to exactly that
#     tag upstream.
#
# The plugin patches are not optional. The CEF line bumped `tauri-utils` and
# `tauri-plugin` to schemars 1.x, while the *released* fs/http/opener build
# scripts still hand `tauri_plugin::Builder` a schemars 0.8 `RootSchema` — that
# combination fails to compile. Only these three pass a scope schema; the other
# plugins build unmodified against the patched `tauri-plugin`. Their versions on
# the branch match the ones pinned in `[workspace.dependencies]` exactly.
#
# Tags, not branches: this is an actively-moving alpha, and a floating branch
# would silently change what a build produces.
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.13" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.13" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.13" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.13" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.13" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.13" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.13" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.13" }

tauri-plugin-fs = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "1423992771e0b57582ca3b06a6adc46ec26aa784" }
tauri-plugin-http = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "1423992771e0b57582ca3b06a6adc46ec26aa784" }
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "1423992771e0b57582ca3b06a6adc46ec26aa784" }

[profile.dev]
opt-level = 0
overflow-checks = false


[profile.release]
opt-level = 3
overflow-checks = true
codegen-units = 1
lto = "fat"
