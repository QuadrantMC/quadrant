[package]
name = "quadrant_next"
version.workspace = true
description = "An easy way to manage your Minecraft mods and modpacks"
authors = ["Demir Yerli <me@mrquantumoff.dev>"]
edition = "2024"

[workspace]
members = ["crates/quadrant-core"]

[workspace.package]
version = "26.4.0-stable"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quadrant_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["proprietary"]
telemetry = []
curseforge = ["quadrant-core/curseforge"]
# Quadrant ID/Sync/Share
quadrant_id = []
updater = []
proprietary = ["telemetry", "curseforge", "quadrant_id"]


[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }


[dependencies]

tauri = { version = "2.11.5", features = ["tray-icon", "config-json5"] }
quadrant-core = { path = "crates/quadrant-core" }

tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = { version = "1.0.103" }
dirs = "6.0.0"
log = "0.4.33"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
tauri-plugin-os = "2.3.2"
rss = "2.1.0"
tauri-plugin-store = "2.4.3"
uuid = { version = "1.23.4", features = ["v7"] }
tauri-plugin-http = "2.5.9"
tokio = { version = "1.52.3", features = ["full"] }
urlencoding = "2.1.3"
open = "5.3.6"
futures = { version = "0.3.32" }
tokio-tungstenite = { version = "0.29.0", features = [
    "rustls-tls-webpki-roots",
    "connect",
] }
sha1 = "0.11.0"
hex = "0.4.3"
colog = "1.4.0"
tauri-plugin-deep-link = { version = "2.4.9" }
tauri-plugin-dialog = "2.7.1"
keyring = { version = "4.1.4", features = [
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-persisted-scope = "2.3.7"
http-cache-reqwest = { version = "1.0.0-alpha.5", default-features = false, features = [
    "manager-moka",
    "url-standard",
] }
reqwest-middleware = "0.5.2"
reqwest = { version = "0.13.4", features = [
    "json",
    "rustls",
    "cookies",
    "query",
    "form",
    # "",
] }
once_cell = "1.21.4"
tauri-plugin-oauth = "2.1.0"
zip = "8.6.0"
url = { version = "2.5.8", features = ["serde", "std"] }


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-cli = "2.4.1"
tauri-plugin-updater = "2.10.0"

[profile.dev]
opt-level = 0
overflow-checks = false


[profile.release]
opt-level = 3
overflow-checks = true
codegen-units = 1
lto = "fat"
