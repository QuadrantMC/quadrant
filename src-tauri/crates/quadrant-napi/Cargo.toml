[package]
name = "quadrant-napi"
version.workspace = true
edition = "2024"
build = "build.rs"

[features]
default = ["proprietary"]
curseforge = ["quadrant-host/curseforge"]
proprietary = ["curseforge"]

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
quadrant-host = { path = "../quadrant-host" }
serde_json = { workspace = true }
tokio = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
