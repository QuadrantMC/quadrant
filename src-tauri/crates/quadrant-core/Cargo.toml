[package]
name = "quadrant-core"
version.workspace = true
edition = "2024"

[features]
default = []
curseforge = []

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
dirs = "6.0.0"
futures = "0.3.32"
hex = "0.4.3"
http-cache-reqwest = { version = "1.0.0-alpha.5", default-features = false, features = [
    "manager-moka",
    "url-standard",
] }
log = "0.4.29"
moka = { version = "0.12.14", features = ["future"] }
once_cell = "1.21.4"
reqwest = { version = "0.13.2", features = [
    "json",
    "rustls",
    "cookies",
    "query",
    "form",
    "stream",
] }
reqwest-middleware = "0.5.1"
rss = "2.0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.11.0"
tokio = { version = "1.50.0", features = ["sync"] }
urlencoding = "2.1.3"
uuid = { version = "1.23.0", features = ["v7"] }
zip = "8.4.0"

[dev-dependencies]
httpmock = "0.8.3"
tempfile = "3.27.0"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "sync"] }
