[package]
name = "quadrant-cli"
version.workspace = true
edition = "2024"
description = "Command-line interface for Quadrant"

[[bin]]
name = "quadrant-cli"
path = "src/main.rs"

[features]
default = ["curseforge"]
curseforge = ["quadrant-core/curseforge", "quadrant-host/curseforge"]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
open = { workspace = true }
quadrant-core = { path = "../quadrant-core" }
quadrant-host = { path = "../quadrant-host" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
